<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spins Logger</title>
    <link rel="stylesheet" href="popup.css" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
  </head>
  <body>
    <header>
      <label
        ><input type="checkbox" id="toggleTrack" /> Tracking</label
      >
      <span id="status" class="off">OFF</span>
      <div id="statusMsg" class="muted"></div>
    </header>

    <section>
      <h3>Domains</h3>
      <div class="row">
        <input id="inpPattern" placeholder="https://example.com/*" />
        <button id="btnAddPattern" class="btn">Add</button>
        <button id="btnAddCurrent" class="btn">
          Add current tab
        </button>
      </div>
      <ul id="domList"></ul>
    </section>

    <section>
      <h3>
        Logs <small>(<span id="count">0</span>)</small>
      </h3>
      <div id="list">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>#</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="row">
        <button id="btnExport" class="btn">Export CSV</button>
        <button id="btnClear" class="btn">Clear</button>
      </div>
    </section>

    <section>
      <h3>
        Bet Logs <small>(<span id="betCount">0</span>)</small>
      </h3>
      <div id="betList">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Amount</th>
              <th>Event</th>
            </tr>
          </thead>
          <tbody id="betTbody"></tbody>
        </table>
      </div>
      <div class="row">
        <button id="btnBetExport" class="btn">Export CSV</button>
        <button id="btnBetClear" class="btn">Clear</button>
      </div>
    </section>

    <hr />

    <!-- ==== ДОБАВЛЕНО: отдельные переключатели и streak для дюжин/рядов ==== -->
    <section>
      <label
        ><input type="checkbox" id="autoBetToggleDozens" />
        Auto-betting (Dozens)</label
      >
      <div class="row">
        <label class="small label-w">Сколько ДЮЖИН подряд</label>
        <input
          id="dozensStreak"
          type="number"
          min="2"
          step="1"
          value="2"
        />
      </div>
      <div id="betStatusDozens" class="small"></div>
    </section>

    <section>
      <label
        ><input type="checkbox" id="autoBetToggleRows" /> Auto-betting
        (Rows)</label
      >
      <div class="row">
        <label class="small label-w">Сколько РЯДОВ подряд</label>
        <input
          id="rowsStreak"
          type="number"
          min="2"
          step="1"
          value="2"
        />
      </div>
      <div id="betStatusRows" class="small"></div>
    </section>

    <!-- ==== CONFIG: ДЮЖИНЫ ==== -->
    <section class="card">
      <h3>Auto-bet Config — Dozens</h3>
      <div class="row">
        <label class="small label-w">Chip selector template</label>
        <input
          id="cfgDznChipTpl"
          placeholder='[data-e2e="chip-{{value}}"]'
        />
      </div>
      <div class="card card-inner">
        <h4>Chips (values)</h4>
        <div id="dznChipsBox"></div>
        <div class="row">
          <button id="btnAddDznChip" class="btn">+ Add chip</button>
        </div>
      </div>
      <div class="row">
        <label class="small label-w">Place button (optional)</label>
        <input
          id="cfgDznPlaceBtn"
          placeholder='e.g. [data-e2e="place-bet"]'
        />
      </div>
      <div class="card card-inner">
        <h4>Steps</h4>
        <div id="dznStepsBox"></div>
        <div class="row">
          <button id="btnAddDznStep" class="btn">+ Add step</button>
        </div>
      </div>
      <div class="row row-end">
        <button id="btnCfgDznDefaults" class="btn">Defaults</button>
        <button id="btnCfgDznSave" class="btn btn-primary">
          Save
        </button>
      </div>
      <div id="cfgDznMsg" class="small"></div>
    </section>

    <!-- ==== CONFIG: РЯДЫ ==== -->
    <section class="card">
      <h3>Auto-bet Config — Rows</h3>
      <div class="row">
        <label class="small label-w">Chip selector template</label>
        <input
          id="cfgRowChipTpl"
          placeholder='[data-e2e="chip-{{value}}"]'
        />
      </div>
      <div class="card card-inner">
        <h4>Chips (values)</h4>
        <div id="rowChipsBox"></div>
        <div class="row">
          <button id="btnAddRowChip" class="btn">+ Add chip</button>
        </div>
      </div>
      <div class="row">
        <label class="small label-w">Place button (optional)</label>
        <input
          id="cfgRowPlaceBtn"
          placeholder='e.g. [data-e2e="place-bet"]'
        />
      </div>
      <div class="card card-inner">
        <h4>Steps</h4>
        <div id="rowStepsBox"></div>
        <div class="row">
          <button id="btnAddRowStep" class="btn">+ Add step</button>
        </div>
      </div>
      <div class="row row-end">
        <button id="btnCfgRowDefaults" class="btn">Defaults</button>
        <button id="btnCfgRowSave" class="btn btn-primary">
          Save
        </button>
      </div>
      <div id="cfgRowMsg" class="small"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>

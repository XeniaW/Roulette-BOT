<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spins Logger</title>
    <link rel="stylesheet" href="popup.css" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
  </head>
  <body>
    <header>
      <label
        ><input type="checkbox" id="toggleTrack" /> Tracking</label
      >
      <span id="status" class="off">OFF</span>
      <div id="statusMsg" class="muted"></div>
    </header>

    <section>
      <h3>Domains</h3>
      <div class="row">
        <input id="inpPattern" placeholder="https://example.com/*" />
        <button id="btnAddPattern" class="btn">Add</button>
        <button id="btnAddCurrent" class="btn">
          Add current tab
        </button>
      </div>
      <ul id="domList"></ul>
    </section>

    <section>
      <h3>
        Logs <small>(<span id="count">0</span>)</small>
      </h3>
      <div id="list">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>#</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="row">
        <button id="btnExport" class="btn">Export CSV</button>
        <button id="btnClear" class="btn">Clear</button>
      </div>
    </section>

    <section>
      <h3>
        Bet Logs <small>(<span id="betCount">0</span>)</small>
      </h3>
      <div id="betList">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Amount</th>
              <th>Event</th>
            </tr>
          </thead>
          <tbody id="betTbody"></tbody>
        </table>
      </div>
      <div class="row">
        <button id="btnBetExport" class="btn">Export CSV</button>
        <button id="btnBetClear" class="btn">Clear</button>
      </div>
    </section>

    <hr />

    <section>
      <label>
        <input type="checkbox" id="autoBetToggle" />
        Auto-betting (Dozens) — OFF by default
      </label>
      <div id="betStatus" class="small"></div>
    </section>

    <!-- === CONFIG UI (минималистичный) === -->
    <section class="card">
      <h3>Auto-bet Config</h3>

      <div class="row">
        <label class="small label-w">Chip selector template</label>
        <input
          id="cfgChipTpl"
          placeholder='[data-e2e="chip-{{value}}"]'
        />
      </div>

      <div class="card card-inner">
        <h4>Chips (values)</h4>
        <p class="small muted">Стоимость фишки в евро или рублях</p>
        <div id="chipsBox"></div>
        <div class="row">
          <button id="btnAddChip" class="btn">+ Add chip</button>
        </div>
      </div>

      <div class="row">
        <label class="small label-w">Place button (optional)</label>
        <input
          id="cfgPlaceBtn"
          placeholder='e.g. [data-e2e="place-bet"]'
        />
      </div>

      <div class="card card-inner">
        <h4>Steps</h4>
        <p class="small muted">Номер фишки умноженый кол-во раз</p>
        <div id="stepsBox"></div>
        <div class="row">
          <button id="btnAddStep" class="btn">+ Add step</button>
        </div>
      </div>

      <div class="row row-end">
        <button id="btnCfgDefaults" class="btn">Defaults</button>
        <button id="btnCfgSave" class="btn btn-primary">Save</button>
      </div>
      <div id="cfgMsg" class="small"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
